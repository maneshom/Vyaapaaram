<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="50%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#042f2e" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="112" fill="url(#tealGrad)" />

  <!-- Subtle inner border -->
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" />

  <!-- Glass-card backdrop behind symbol -->
  <rect x="96" y="96" width="320" height="320" rx="48" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="2" filter="url(#shadow)" />

  <!-- Upward growth arrow bar chart on the right side -->
  <rect x="330" y="270" width="22" height="90" rx="11" fill="#38bdf8" opacity="0.8" />
  <rect x="362" y="220" width="22" height="140" rx="11" fill="#2dd4bf" />

  <!-- Trending Arrow -->
  <path d="M 280 250 L 340 190 L 370 190 L 370 220" fill="none" stroke="#2dd4bf" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Prominent Indian Rupee (₹) Symbol -->
  <g fill="#ffffff" filter="url(#shadow)">
    <!-- Top Horizontal Bar -->
    <rect x="150" y="180" width="120" height="20" rx="6" />
    
    <!-- Second Horizontal Bar -->
    <rect x="150" y="220" width="105" height="20" rx="6" />
    
    <!-- Vertical Spine -->
    <rect x="175" y="180" width="22" height="180" rx="6" />
    
    <!-- Upper Loop Arc -->
    <path d="M 180 200 Q 255 200 255 235 Q 255 270 180 270" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" />
    
    <!-- Slanted Leg -->
    <path d="M 195 270 L 265 360" stroke="#ffffff" stroke-width="22" stroke-linecap="round" />
  </g>
</svg>
